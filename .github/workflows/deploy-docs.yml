
name: 部署文档

on:
  push:
    branches:
      # 确保这是你正在使用的分支名称
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout - 克隆仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # 如果你文档需要 Git 子模块，取消注释下一行
          submodules: true
          token: '${{ secrets.VUEPRESS }}'

      # - name: Checkout - 更新子模块到最新
      #   run: |
      #     git submodule foreach git pull origin main

      # 文档的克隆、构建、部署。注意 `clone --depth 1` 只拉取最近一次提交，减少时间
      # --depth 1 选项会损失git历史，但能加速编译。可自行启用/关闭
      # 注意若使用该选项，必须要删除 .git 文件夹，避免时间和贡献者错乱
      - name: Checkout - 文档库1
        working-directory: ./src/
        run: |
          git clone --depth 1 https://github.com/LincDocs/MdNote_Public.git
          rm -rf MdNote_Public/.git
          # git clone --depth 1 https://${{ secrets.VUEPRESSORG }}@github.com/LincDocs/MdNote_Work.git
          # rm -rf MdNote_Work/.git
        env:
          GH_TOKEN: ${{ secrets.VUEPRESSORG }}

      - name: Checkout - 文档库2
        working-directory: ./src/
        run: mkdir MdNote_Other
      - name: Checkout - 文档库2-2
        working-directory: ./src/MdNote_Other/
        run: |
          git clone --depth 1 https://github.com/LincDocs/ComfyUI_examples.git
          rm -rf ComfyUI_examples/.git
          git clone --depth 1 https://github.com/LincDocs/ComfyUI-Workflows-ZHO.git
          rm -rf ComfyUI-Workflows-ZHO/.git
          git clone --depth 1 https://github.com/LincDocs/ComfyUI-Workflows-Linc.git
          rm -rf ComfyUI-Workflows-Linc/.git
          git clone --depth 1 https://github.com/LincZero/LincZero.git
          rm -rf LincZero/.git
        # git clone --depth 1 https://github.com/LincDocs/Pkmer-Math.git

      - name: 环境 - 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: true
          version: 9

      - name: 环境 - 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # [!code] 根据实际情况修改 (需要在仓库配置写入以及和文档仓库clone这两个步骤的后面)
      - name: 配置 - 设置
        working-directory: ./
        run: |
          > scripts/git_config.json
          pnpm run gen-config

      - name: 构建文档
        env:
          NODE_OPTIONS: --max_old_space_size=20480
        run: |-
          node -e 'console.log(v8.getHeapStatistics())'
          # 这里排除一下 latex 的某个警告日志，太占日志空间了，我有一个库能被这占两万多行
          # 或 pnpm run docs:build 2>&1 | grep -v "Found unicode character .* inside tex"，或加上 package.json 上
          pnpm run docs:build 2>&1 | grep -v "Found unicode character"
          > src/.vuepress/dist/.nojekyll

      - name: 部署文档
        uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          # 这是文档部署到的分支名称
          branch: gh-pages
          folder: src/.vuepress/dist
